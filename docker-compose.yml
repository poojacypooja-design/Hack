services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solvex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: solvex
    ports:
      - "5432:5432"
    volumes:
      - solvex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvex -d solvex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  solvex-postgres-data:
